name: Isolate Changes
on:
  push: null
jobs:
  files-modified:
    name: Get modified files
    runs-on: ubuntu-latest
    outputs:
      amm_modified: ${{ steps.adaptivemm.outputs.amm_modified }}
      ad_modified: ${{ steps.adaptived.outputs.ad_modified }}
    steps:
    - uses: actions/checkout@v4
    - name: Fetch
      run: git fetch
    - name: Set adaptivemm-modified to 1 if files were changed
      id: adaptivemm
      env:
        BRANCH: ${{ github.base_ref }}
      run: 'echo "BRANCH = $BRANCH"

        if [[ -n "$BRANCH" ]]; then amm_modified=$(./diff.sh -m -s origin/$BRANCH) ; else amm_modified=$(./diff.sh
        -m) ; fi

        echo "amm_modified=$amm_modified"

        echo "amm_modified=$amm_modified" >> $GITHUB_OUTPUT

        '
    - name: Set adaptived-modified to 1 if files were changed
      id: adaptived
      env:
        BRANCH: ${{ github.base_ref }}
      run: 'echo "BRANCH = $BRANCH"

        if [[ -n "$BRANCH" ]]; then ad_modified=$(./diff.sh -d -s origin/$BRANCH) ; else ad_modified=$(./diff.sh
        -d) ; fi

        echo "ad_modified=$ad_modified"

        echo "ad_modified=$ad_modified" >> $GITHUB_OUTPUT

        '
  adaptivemm-modified-check:
    name: adaptivemm modification status
    needs:
    - files-modified
    env:
      amm_modified: ${{ needs.files-modified.outputs.amm_modified }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the current adaptivemm executable
      run: 'make

        sha256sum -b adaptivemmd > adaptivemmd.SHA256

        cat adaptivemmd.SHA256

        '
    - name: Checkout the commit prior to this change
      env:
        BRANCH: ${{ github.base_ref }}
      run: 'git fetch

        echo "BRANCH = $BRANCH"

        if [[ -n "$BRANCH" ]]; then git checkout origin/$BRANCH ; else git checkout origin/master ; fi

        '
    - name: Build the previous adaptivemm executable
      id: shastep
      continue-on-error: true
      run: 'make clean

        make

        sha256sum -b adaptivemmd

        sha256sum -c adaptivemmd.SHA256

        '
    - name: Print Results
      run: "if [[ $amm_modified == 1 ]]; then\n  if [[ ${{ steps.shastep.outcome }} == 'failure' ]]; then\n\
        \    echo \"adaptivemm source was modified, and the SHA256 changed as expected\"\n  else\n   \
        \ echo \"WARNING: adaptivemm source was modified, but the SHA256SUM didn't change\"\n  fi\nelse\n\
        \  if [[ ${{ steps.shastep.outcome }} == 'failure' ]]; then\n    echo \"ERROR: adaptivemm source\
        \ was not modified, but the SHA256SUM changed\"\n  else\n    echo \"adaptivemm source was not\
        \ modified, and the SHA256 remained the same\"\n  fi\nfi\n"
    - name: Verbose
      env:
        BRANCH: ${{ github.base_ref }}
      run: 'echo "BRANCH = $BRANCH"

        git checkout ${{ github.sha }}

        echo "The following files were changed:"

        if [[ -n "$BRANCH" ]]; then ./diff.sh -m -s origin/$BRANCH -v ; else ./diff.sh -m -v ; fi

        '
  adaptived-modified-check:
    name: adaptived modification status
    needs:
    - files-modified
    env:
      ad_modified: ${{ needs.files-modified.outputs.ad_modified }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: 'sudo apt-get update

        sudo apt-get install libjson-c-dev lcov cmake bison flex autoconf automake libtool libsystemd-dev
        -y

        '
    - name: Build the current adaptived executable
      run: 'pushd adaptived

        ./autogen.sh

        ./configure

        make

        sha256sum -b src/adaptived > adaptived.SHA256

        cat adaptived.SHA256

        popd

        '
    - name: Checkout the commit prior to this change
      env:
        BRANCH: ${{ github.base_ref }}
      run: 'git fetch

        echo "BRANCH = $BRANCH"

        if [[ -n "$BRANCH" ]]; then git checkout origin/$BRANCH ; else git checkout origin/master ; fi

        '
    - name: Build the previous adaptived executable
      id: shastep
      continue-on-error: true
      run: 'pushd adaptived

        ./autogen.sh

        ./configure

        make clean

        make

        sha256sum -b src/adaptived

        sha256sum -c adaptived.SHA256

        '
    - name: Print Results
      run: "if [[ $ad_modified == 1 ]]; then\n  if [[ ${{ steps.shastep.outcome }} == 'failure' ]]; then\n\
        \    echo \"adaptived source was modified, and the SHA256 changed as expected\"\n  else\n    echo\
        \ \"WARNING: adaptived source was modified, but the SHA256SUM didn't change\"\n  fi\nelse\n  if\
        \ [[ ${{ steps.shastep.outcome }} == 'failure' ]]; then\n    echo \"ERROR: adaptived source was\
        \ not modified, but the SHA256SUM changed\"\n  else\n    echo \"adaptived source was not modified,\
        \ and the SHA256 remained the same\"\n  fi\nfi\n"
    - name: Verbose
      env:
        BRANCH: ${{ github.base_ref }}
      run: 'echo "BRANCH = $BRANCH"

        git checkout ${{ github.sha }}

        echo "The following files were changed:"

        if [[ -n "$BRANCH" ]]; then ./diff.sh -d -s origin/$BRANCH -v ; else ./diff.sh -d -v ; fi

        '
